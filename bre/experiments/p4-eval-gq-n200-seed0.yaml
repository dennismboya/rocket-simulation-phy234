# Phase 4 protocol dry run on SYNTHETIC G_Q data (gq_n200_seed0): every registered model on every
# split of PLAN.md section 6, structural tests (data-level, plus the model-level checks: Q5's
# quarter law, Q3/Q5's zero order effect by construction, Q4's decoherence rates), decision rule
# (which cannot return "Q-model supported" on synthetic data). Fits: 40 (10 models x 4 splits);
# the first five models were estimated at about 50 minutes on 4 cores with the settings below;
# the second five (B3, B5, B6, Q3, Q5) are untimed (bre.recover.SECONDS_PER_STEP_ASSUMED holds
# the assumed step costs: Q3 like Q2, B5 a few sklearn fits) — run in the background
# (make eval > runs/eval.log &) and time it before scheduling anything longer. B5 ignores the
# Adam / L-BFGS / n_samples settings (external fit, no draws). Q3 runs at the default time
# t = 1 on this table (no news age in the synthetic design).
name: p4-eval-gq-n200-seed0
dataset: data/synthetic/gq_n200_seed0.parquet
data: {}
models: [B1, B2, B3, B4, B5, B6, Q2, Q3, Q4, Q5]
splits:
  - {type: subjects, test_frac: 0.2, seed: 0}        # (a)
  - {type: pairs}                                     # (b) train singles + none, test ordered pairs
  - {type: order, train_order: tolerance-first}       # (c)
  - {type: temporal, test_frac: 0.2}                  # (d)
model_kwargs: {}
fit:
  restarts: 2
  steps: 800
  lr: 0.02
  val_frac: 0.2
  seed: 0
  early_stopping_patience: 4
  eval_every: 25
  lbfgs_polish: true
  lbfgs_steps: 50
  n_samples: 30
  svi_steps: 2000
  svi_lr: 0.01
bootstrap:
  n_draws: 1000
  seed: 0
output:
  dir: runs/eval/p4-eval-gq-n200-seed0
  metrics_path: reports/eval/p4-eval-gq-n200-seed0.json
  table_path: reports/eval/p4-eval-gq-n200-seed0.md
